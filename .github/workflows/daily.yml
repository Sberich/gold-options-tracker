name: Gold Options Daily Tracker
on:
  schedule:
    - cron: '0 1 * * 1-5'    # 08:00 น. ไทย
    - cron: '0 6 * * 1-5'    # 13:00 น. ไทย
    - cron: '0 13 * * 1-5'   # 20:00 น. ไทย
  workflow_dispatch:
    inputs:
      asset:
        description: 'Asset to run (gold, silver, oil, sp500, nasdaq, all)'
        required: false
        default: 'all'

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🚀 Run Multi-Asset CME Tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TARGET_ASSET: ${{ github.event.inputs.asset || 'all' }}
        run: python gold_tracker.py $TARGET_ASSET
