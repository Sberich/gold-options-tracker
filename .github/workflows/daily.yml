
name: Gold Options Daily Tracker

on:
  # รันอัตโนมัติทุกวัน 00:00 UTC = 07:00 Thailand
  schedule:
    - cron: '0 0 * * 1-5'   # จันทร์-ศุกร์ เท่านั้น (ตลาดเปิด)

  # รันได้ด้วยตนเองจาก GitHub UI
  workflow_dispatch:

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🥇 Run Gold Options Tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python gold_tracker.py
