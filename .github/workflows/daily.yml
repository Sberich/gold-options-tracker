name: Gold Options Daily Tracker
on:
  schedule:
    - cron: '0 1 * * 1-5'    # 08:00 Thailand
    - cron: '0 6 * * 1-5'    # 13:00 Thailand
    - cron: '0 13 * * 1-5'   # 20:00 Thailand
  workflow_dispatch:

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🥇 Run Gold Options Tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python gold_tracker.py
