name: Gold Tracker

on:
  schedule:
    - cron: '0 1 * * *'   # 08:00 น. ไทย
    - cron: '0 6 * * *'   # 13:00 น. ไทย
    - cron: '0 13 * * *'  # 20:00 น. ไทย
  workflow_dispatch:        # ← ตัวนี้สำคัญ ทำให้กด trigger ได้

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests numpy

      - name: Run Gold Tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ secrets.GH_REPO }}
        run: python gold_tracker_v6.py
